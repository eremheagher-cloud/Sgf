name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verificar Windows e permissões
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Sistema operacional:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Usuário atual:"
          whoami

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'A instalação do Tailscale falhou.'
          }

          Write-Host 'Tailscale instalado.'

      - name: Autenticar no Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY nos secrets do repositório.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw 'O Tailscale não conseguiu autenticar.'
          }

          & $tailscale status

      - name: Verificar usuário e serviço RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Usuário atual do runner:'
          whoami

          Write-Host 'Usuário Rafael, se existir:'
          Get-LocalUser -Name Rafael -ErrorAction SilentlyContinue

          Write-Host 'Serviço de Área de Trabalho Remota:'
          Get-Service -Name TermService |
            Select-Object Name, Status, StartType

          Write-Host ''
          Write-Host 'O runner hospedado pelo GitHub é temporário.'
          Write-Host 'Estas verificações não garantem conectividade RDP externa.'

      - name: Manter execução por até 6 horas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(6)

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)

            Write-Host (
              'Tempo restante: {0:hh\:mm\:ss}' -f $remaining
            )

            Start-Sleep -Seconds 60
          }

          Write-Host 'Tempo de espera concluído.'
