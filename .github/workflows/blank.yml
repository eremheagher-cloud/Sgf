
name: Meu PC Virtual

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da sessão"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  virtual-pc:
    name: Preparar PC Virtual
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Gerar conta e código de acesso
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $username = "PCVirtual"
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes).
            Replace('+','A').Replace('/','B').TrimEnd('=')

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "Meu PC Virtual" `
              -Description "Conta temporária" | Out-Null
          } else {
            Set-LocalUser -Name $username `
              -Password $securePassword
          }

          $code = [Guid]::NewGuid().ToString("N").Substring(0,8).ToUpper()

          $summary = @"
          # Meu PC Virtual

          **Estado:** Conta temporária criada

          | Informação | Valor |
          |---|---|
          | Sessão | ${{ inputs.instance_number }} |
          | Nome da conta Windows | $username |
          | Senha da sessão | $password |
          | Código da sessão | $code |
          | Sistema | Windows Server 2022 |

          ## Como conectar

          1. Abra a aplicação Área de Trabalho Remota (RDP).
          2. Informe o endereço de um PC remoto que você controla.
          3. Use o nome da conta e a senha acima, se essa conta existir nesse PC.

          **Importante:** o código da sessão é apenas um identificador.
          Ele não é um endereço de rede nem um código de autenticação RDP.
          Este runner é temporário e não recebe conexões RDP externas
          automaticamente.
          "@

          $summary | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8

          Write-Host "Conta preparada. Consulte o resumo da execução."
          Write-Host "A senha não será impressa nos logs."

      - name: Informações da sessão
        shell: pwsh
        run: |
          Write-Host "Abra o resumo desta execução para ver os dados."
          Write-Host "O runner será encerrado quando o workflow terminar."
          
