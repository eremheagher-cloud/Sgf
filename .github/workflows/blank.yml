name: PC virtual - eremheagher-cloud

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Numero da instancia (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Verificar conta autorizada
        shell: pwsh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'

          $AuthorizedAccount = 'eremheagher-cloud'
          $CurrentAccount = $env:GITHUB_ACTOR

          Write-Host "Conta detectada: $CurrentAccount"

          if ($CurrentAccount -ine $AuthorizedAccount) {
            throw "Acesso negado: conta nao autorizada."
          }

          Write-Host "Conta autorizada."

      - name: Validar configuracao do Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {
            throw "Configure o segredo TAILSCALE_AUTH_KEY nas configuracoes do repositorio."
          }

          Write-Host "Segredo encontrado. O valor nao sera exibido."

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          use-cache: 'false'

      - name: Verificar conexao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Tailscale = Get-Command tailscale.exe `
            -ErrorAction SilentlyContinue

          if (-not $Tailscale) {
            throw "Cliente Tailscale nao encontrado no PATH."
          }

          & $Tailscale.Source status

          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel verificar o estado do Tailscale."
          }

          Write-Host "Verificacao do Tailscale concluida."

      - name: Informacoes da instancia
        shell: pwsh
        env:
          INSTANCE_NUMBER: ${{ inputs.instance_number }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Number = 0

          if (-not [int]::TryParse(
            $env:INSTANCE_NUMBER, [ref]$Number
          ) -or $Number -lt 1 -or $Number -gt 10) {
            throw "Escolha um numero de instancia entre 1 e 10."
          }

          Write-Host "Instancia selecionada: $Number"
          Write-Host "Runner Windows temporario do GitHub Actions."
          Write-Host "O runner sera encerrado quando o job terminar."
