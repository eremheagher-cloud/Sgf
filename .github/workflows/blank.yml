name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verificar configuração
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(10|[1-9])$') {
            throw 'Escolha uma instância entre 1 e 10.'
          }

          Write-Host "Instância selecionada: $instance"
          Write-Host "Runner oficial do GitHub: Windows Server 2022"

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'O executável do Tailscale não foi encontrado.'
          }

          Write-Host 'Tailscale instalado com sucesso.'

      - name: Autenticar no Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'O segredo TAILSCALE_AUTH_KEY não está configurado.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="pc-alves7-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na autenticação do Tailscale. Código: $LASTEXITCODE"
          }

          Write-Host 'Autenticação do Tailscale concluída.'

      - name: Verificar conexão
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale status

          if ($LASTEXITCODE -ne 0) {
            throw 'Não foi possível consultar o status do Tailscale.'
          }

          Write-Host 'Verificação concluída.'

      - name: Informações da sessão
        shell: pwsh
        run: |
          Write-Host 'O runner oficial do GitHub é temporário.'
          Write-Host 'O workflow terminará ao concluir suas etapas.'
          Write-Host 'Este workflow não cria uma sessão RDP persistente.'
