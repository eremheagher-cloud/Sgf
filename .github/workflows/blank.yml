name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process $installer -ArgumentList '/quiet' -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (!(Test-Path $tailscale)) {
            throw 'Tailscale installation failed.'
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing repository secret TAILSCALE_AUTH_KEY.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale could not connect. Check the auth key.'
          }

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if ($LASTEXITCODE -ne 0 -or !$ip) {
            throw 'Could not obtain Tailscale IP.'
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          & $tailscale status

      - name: Enable RDP and Configure Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-NetFirewallProfile -Profile Domain,Private,Public `
            -DefaultInboundAction Block

          Write-Host 'RDP enabled. Firewall defaults remain blocked.'

      - name: Create Rafael Account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Wl7mX#2026@Pc!'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' |
              Out-Null
          }
          else {
            Set-LocalUser -Name $Username -Password $SecurePassword
          }

          Enable-LocalUser -Name $Username

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host 'Windows account configured.'

      - name: Test RDP Listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if ($listener) {
            Write-Host 'RDP port 3389 is listening.'
          }
          else {
            Write-Host 'RDP port 3389 is not listening yet.'
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Show Connection Details
        if: ${{ success() }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '======= VIRTUAL PC DETAILS ======='
          Write-Host 'Account: Rafael'
          Write-Host 'Password: Wl7mX#2026@Pc!'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'RDP port: 3389'
          Write-Host '=================================='

      - name: Keep Runner Active
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddHours(5)

          while ((Get-Date) -lt $endTime) {
            Write-Host "Runner active: $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
