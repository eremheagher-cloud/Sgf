name: PC virtual - eremheagher-cloud

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Numero da instancia (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Verificar conta GitHub
        shell: pwsh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'

          $AuthorizedAccount = 'eremheagher-cloud'
          $CurrentAccount = $env:GITHUB_ACTOR

          Write-Host "Conta detectada: $CurrentAccount"

          if ($CurrentAccount -ine $AuthorizedAccount) {
            throw "Acesso negado: conta nao autorizada."
          }

          Write-Host "Conta autorizada."

      - name: Validar segredo Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {
            throw "Configure o segredo TAILSCALE_AUTH_KEY em Settings > Secrets and variables > Actions."
          }

          Write-Host "Segredo encontrado. Valor oculto por seguranca."

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          use-cache: 'false'

      - name: Verificar instancia
        shell: pwsh
        env:
          INSTANCE_NUMBER: ${{ inputs.instance_number }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Number = 0

          if (-not [int]::TryParse(
            $env:INSTANCE_NUMBER, [ref]$Number
          ) -or $Number -lt 1 -or $Number -gt 10) {
            throw "Numero de instancia invalido. Escolha de 1 a 10."
          }

          Write-Host "Instancia selecionada: $Number"
          Write-Host "Runner Windows do GitHub Actions iniciado."
          Write-Host "A conexao Tailscale foi solicitada."
          Write-Host "O runner e temporario e sera encerrado ao fim do job."
