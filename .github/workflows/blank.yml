
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(10|[1-9])$') {
            throw 'Choose an instance between 1 and 10.'
          }

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Instance: $instance"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'Tailscale installation failed.'
          }

          Write-Host 'Tailscale installed.'

      - name: Authenticate Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY in repository Actions secrets.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed: code $LASTEXITCODE"
          }

          & $tailscale status

      - name: Inspect policy and create Rafael account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Rafael#Wl7mX@2026'

          Write-Host 'Local account policy:'
          net accounts

          $PolicyFile = Join-Path $env:TEMP 'security-policy.inf'
          secedit /export /cfg $PolicyFile /areas SECURITYPOLICY /quiet

          if (Test-Path $PolicyFile) {
            Select-String -Path $PolicyFile `
              -Pattern 'PasswordComplexity|MinimumPasswordLength|PasswordHistorySize'
          }

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' `
              -ErrorAction Stop
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -ErrorAction Stop
          }

          Get-LocalUser -Name $Username |
            Select-Object Name, Enabled

          Write-Host 'Rafael account created or updated.'

      - name: Check RDP service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            $service | Select-Object Name, Status, StartType
          }

          Write-Host 'RDP service status checked.'

      - name: Keep runner active for up to 6 hours
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(6)

          Write-Host 'Keeping the runner active.'

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)

            Write-Host (
              'Time remaining: {0:hh\:mm\:ss}' -f $remaining
            )

            Start-Sleep -Seconds 60
          }

          Write-Host 'Wait period completed.'
          
