name: PC virtual - Tailscale automatico

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Numero da instancia (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Verificar conta GitHub
        shell: pwsh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'

          $AuthorizedAccount = 'eremheagher-cloud'

          Write-Host "Conta detectada: $env:GITHUB_ACTOR"

          if ($env:GITHUB_ACTOR -ine $AuthorizedAccount) {
            throw "Conta GitHub nao autorizada."
          }

          Write-Host "Conta autorizada."

      - name: Validar credenciais OAuth
        shell: pwsh
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
            $env:TS_OAUTH_CLIENT_ID
          )) {
            throw "Configure o segredo TS_OAUTH_CLIENT_ID."
          }

          if ([string]::IsNullOrWhiteSpace(
            $env:TS_OAUTH_SECRET
          )) {
            throw "Configure o segredo TS_OAUTH_SECRET."
          }

          Write-Host "Credenciais OAuth configuradas."

      - name: Conectar ao Tailscale e gerar chave temporaria
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          use-cache: 'false'

      - name: Verificar instancia
        shell: pwsh
        env:
          INSTANCE_NUMBER: ${{ inputs.instance_number }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Number = 0

          if (-not [int]::TryParse(
            $env:INSTANCE_NUMBER, [ref]$Number
          ) -or $Number -lt 1 -or $Number -gt 10) {
            throw "Numero de instancia invalido. Use 1 a 10."
          }

          Write-Host "Instancia selecionada: $Number"
          Write-Host "Conexao Tailscale solicitada."
          Write-Host "Runner Windows temporario do GitHub Actions."
