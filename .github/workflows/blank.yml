name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(10|[1-9])$') {
            throw 'Choose an instance between 1 and 10.'
          }

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Instance: $instance"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'Tailscale installation failed.'
          }

          Write-Host 'Tailscale installed.'

      - name: Authenticate Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY in repository Actions secrets.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed: code $LASTEXITCODE"
          }

          & $tailscale status

          $TailscaleIP = (
            & $tailscale ip -4 |
            Select-Object -First 1
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($TailscaleIP)) {
            throw 'Could not obtain the Tailscale IPv4 address.'
          }

          "TAILSCALE_IP=$TailscaleIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Rafael Account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Wl7mX#2026@Pc!'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' `
              -ErrorAction Stop | Out-Null
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -ErrorAction Stop
          }

          Enable-LocalUser -Name $Username

          Write-Host 'Windows account is ready.'

      - name: Check RDP Service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            $service |
              Select-Object Name, Status, StartType
          }
          else {
            Write-Host 'RDP service was not found.'
          }

      - name: Show Access Details
        if: ${{ success() }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '======================================'
          Write-Host '          VIRTUAL PC DETAILS'
          Write-Host '======================================'
          Write-Host "Account name: Rafael"
          Write-Host 'Password: Wl7mX#2026@Pc!'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'RDP port: 3389'
          Write-Host '======================================'
          Write-Host ''

      - name: Keep Runner Active for 6 Hours
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(6)

          Write-Host 'Keeping the runner active.'

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)

            Write-Host (
              'Time remaining: {0:hh\:mm\:ss}' -f $remaining
            )

            Start-Sleep -Seconds 60
          }

          Write-Host 'Wait period completed.'
