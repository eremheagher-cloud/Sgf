name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verificar configuração
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(10|[1-9])$') {
            throw 'Escolha uma instância entre 1 e 10.'
          }

          Write-Host "Instância selecionada: $instance"
          Write-Host 'Runner oficial do GitHub: Windows Server 2022'

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'Tailscale não foi encontrado após a instalação.'
          }

          Write-Host 'Tailscale instalado com sucesso.'

      - name: Autenticar no Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure o segredo TAILSCALE_AUTH_KEY nas configurações do GitHub.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na autenticação do Tailscale: código $LASTEXITCODE"
          }

          Write-Host 'Tailscale autenticado.'

      - name: Criar usuário Windows Rafael
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*'.ToCharArray()

          $Password = -join (1..20 | ForEach-Object {
            $Chars[(Get-Random -Maximum $Chars.Length)]
          })

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Usuário Rafael'
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }

          Write-Host ''
          Write-Host '===== DADOS DO WINDOWS ====='
          Write-Host "Usuário: $Username"
          Write-Host "Senha: $Password"
          Write-Host '============================'

      - name: Verificar conexão Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale status

          if ($LASTEXITCODE -ne 0) {
            throw 'Não foi possível verificar a conexão do Tailscale.'
          }

      - name: Manter execução por até 6 horas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $EndTime = (Get-Date).AddHours(6)

          Write-Host 'Mantendo a execução ativa.'

          while ((Get-Date) -lt $EndTime) {
            $Remaining = $EndTime - (Get-Date)
            Write-Host (
              'Tempo restante: {0:hh\:mm\:ss}' -f $Remaining
            )
            Start-Sleep -Seconds 60
          }

          Write-Host 'Tempo de espera concluído.'
