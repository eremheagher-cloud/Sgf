
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verificar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(10|[1-9])$') {
            throw 'Escolha uma instância entre 1 e 10.'
          }

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Instância: $instance"
          Write-Host 'Runner do GitHub iniciado.'

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw 'A instalação do Tailscale falhou.'
          }

          Write-Host 'Tailscale instalado.'

      - name: Autenticar no Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY em Settings > Secrets and variables > Actions.'
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na autenticação do Tailscale: código $LASTEXITCODE"
          }

          & $tailscale status

      - name: Criar conta Windows Rafael
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'rafaelehf'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Conta Windows Rafael'
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }

          Write-Host 'Conta Windows Rafael criada ou atualizada.'

      - name: Verificar serviço RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            $service | Select-Object Name, Status, StartType
          }

          Write-Host 'A verificação do serviço não garante acesso RDP externo.'

      - name: Manter execução por até 6 horas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(6)

          Write-Host 'Mantendo o runner ativo.'

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)

            Write-Host (
              'Tempo restante: {0:hh\:mm\:ss}' -f $remaining
            )

            Start-Sleep -Seconds 60
          }

          Write-Host 'Tempo de espera concluído.'
          
